name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  blt:
    uses: ./.github/workflows/blt.yml

  release:
    name: Tag and release
    needs: blt
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup Bun (oven-sh/setup-bun v2.2.0)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Write the release notes
        id: notes
        env:
          BUMP: ${{ inputs.bump }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: bun scripts/release.ts
      - name: Tag the release
        env:
          TAG: ${{ steps.notes.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.notes.outputs.tag }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: gh release create "$TAG" --title "Release $TAG" --notes-file "$NOTES_FILE" --verify-tag
      - name: Move the major tag
        env:
          TAG: ${{ steps.notes.outputs.tag }}
        run: |
          major="${TAG%%.*}"
          git tag -f "$major" "$TAG"
          git push -f origin "refs/tags/$major"
